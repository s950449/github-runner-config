name: Forgejo isolated runner smoke test
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: openbsd-vmm
    timeout-minutes: 5
    steps:
      - name: Check guest identity
        run: |
          set -eu
          id
          test "$(id -u)" -ne 0
          test ! -S /var/run/docker.sock
          if sudo -n true 2>/dev/null; then exit 1; fi
          echo 'Forgejo runner smoke test passed'
