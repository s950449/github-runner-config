name: Isolated runner smoke test
on:
  workflow_dispatch:
permissions: {}
jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, openbsd-vmm]
    timeout-minutes: 5
    steps:
      - name: Check execution identity
        shell: bash
        run: |
          set -eu
          id
          test "$(id -u)" -ne 0
          test "$(uname -m)" = x86_64
          if sudo -n true 2>/dev/null; then
            echo 'Unexpected passwordless sudo'
            exit 1
          fi
          test ! -S /var/run/docker.sock
          echo 'Runner smoke test passed'
